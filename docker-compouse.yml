version: '3.8'

services:
  db:
    image: postgres:18-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=19732846
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
