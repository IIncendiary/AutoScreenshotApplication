version: '3.8'

services:
  app:
    build: .
    container_name: screenshot-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/applicationDb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=19732846
    depends_on:
      db:
       condition: service_healthy





  db:
    image: postgres:18-alpine
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=userDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=19732846
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
